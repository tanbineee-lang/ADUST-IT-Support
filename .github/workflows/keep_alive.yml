name: Keep Streamlit Alive

on:
  schedule:
    # Runs automatically every 12 hours (00:00 and 12:00 UTC)
    - cron: '0 0,12 * * *'
  workflow_dispatch: # Allows you to test it manually anytime

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit App
        run: |
          curl -s -L "https://YOUR_APP_URL.streamlit.app" > /dev/null
          echo "Pinged successfully at $(date)"
